# pr-gate — the PR-blocking CI tier (F-01, contract C-01).
#
# Check names below are FROZEN in protocols/ci-gates.contract.md — they are the
# branch-protection interface. Renaming a job's `name:` is a breaking change
# and MUST land together with the branch-protection update in the same PR.
#
# Tier summary (see the contract for the full CiGateConfig):
#   typecheck           blocking     tsc --noEmit -p hooks/tsconfig.json,
#                                    ratcheted against TYPECHECK_ERROR_BASELINE
#                                    (49 pre-existing errors; Phase 9 drives
#                                    this to 0 and the baseline drops with it —
#                                    the gate fails only on NEW errors)
#   lint                blocking     bunx eslint . (flat config lands Phase 2b;
#                                    vacuous pass until the config exists)
#   changed-file-tests  blocking     bun scripts/ci/changed-files-vitest.ts
#   hook-drift          blocking     Phase 13 reconciled the three sources (defect 10)
#   docs-drift          blocking     Phase 16 landed generated-docs markers + manifest (defect 12)
#   library-catalog     blocking     bun scripts/ci/check-library-catalog.ts
#
# Every run publishes `.loom-ci/gate-status.toon` as a machine-readable artifact.

name: pr-gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Error-count baseline. Phase 9 (typecheck-zero, F-06) drove the count to
      # 0, so the gate is now zero-tolerance: any type error fails the PR.
      # Ratchet DOWN only — never raise this.
      TYPECHECK_ERROR_BASELINE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: tsc --noEmit against error-count baseline
        run: |
          set -u
          bunx tsc --noEmit -p hooks/tsconfig.json > tsc-output.txt 2>&1 || true
          count=$(grep -cE 'error TS[0-9]+' tsc-output.txt || true)
          echo "typecheck: ${count} errors (baseline ${TYPECHECK_ERROR_BASELINE})"
          if [ "${count}" -gt "${TYPECHECK_ERROR_BASELINE}" ]; then
            echo "::error::typecheck: ${count} errors exceed baseline ${TYPECHECK_ERROR_BASELINE} — this PR introduces new type errors"
            cat tsc-output.txt
            exit 1
          fi
          if [ "${count}" -lt "${TYPECHECK_ERROR_BASELINE}" ]; then
            echo "::notice::typecheck error count dropped to ${count} — ratchet TYPECHECK_ERROR_BASELINE down in .github/workflows/pr-gate.yml"
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: bunx eslint .
        run: |
          if [ -f eslint.config.js ] || [ -f eslint.config.mjs ] || [ -f eslint.config.cjs ] || [ -f eslint.config.ts ]; then
            bunx eslint .
          else
            echo "::warning::lint: no ESLint flat config yet — Phase 2b lands eslint.config.js; passing vacuously"
          fi

  changed-file-tests:
    name: changed-file-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Configure git identity
        # Many tests init a throwaway repo and `git commit`; CI runners have no
        # ambient user.name/user.email, so the commit fails and the whole test
        # file errors. Set a global identity so any git-touching test works.
        run: |
          git config --global user.email "ci@loom.test"
          git config --global user.name "Loom CI"
          git config --global init.defaultBranch main

      - name: Run tests mapped from the PR diff
        run: bun scripts/ci/changed-files-vitest.ts --base "origin/${{ github.base_ref || 'main' }}"

  hook-drift:
    name: hook-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Phase 13 reconciled the three registration sources (defect 10), so this
      # check runs blocking: any drift now fails the PR gate.
      - name: Compare the three hook-registration sources
        run: bun scripts/ci/check-hook-drift.ts

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hook-drift-report
          path: .loom-ci/hook-drift.toon
          if-no-files-found: ignore

  docs-drift:
    name: docs-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Blocking as of Phase 16: check-docs-drift recomputes every generated
      # section from source and fails if the docs or manifest are stale.
      - name: Recompute generated-docs checksums
        run: bun scripts/ci/check-docs-drift.ts --check

  library-catalog:
    name: library-catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate skills/library.yaml
        run: bun scripts/ci/check-library-catalog.ts

  eval-t1:
    # T1 eval tier (Phase 20, F-20): static / in-process evals that make ZERO
    # network/LLM calls (llmCalls MUST be 0). Runs on every PR and fails the job
    # on any red eval. This job is ADDITIVE — the frozen 6-check branch-
    # protection interface (protocols/ci-gates.contract.md, checks[6]) is left
    # untouched, so the gate-status table below is unchanged.
    name: eval-t1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run T1 evals (static, zero LLM calls)
        run: bun scripts/eval/run-evals.ts --tier t1

  browser-fixture-tests:
    # Offline browser fixture-parser + browser-skill tests (Phase 9a,
    # PLAN-browser-e2e). These suites (tests/browser, tests/skills, tests/eval,
    # skills/browser-skills) are hermetic: every live-Chromium case self-skips
    # (C-07 actionable skip — no browser is installed in this job), so the job is
    # green without a daemon while still catching fixture/parser regressions on
    # every PR.
    #
    # This job is ADDITIVE — it is deliberately NOT added to the gate-status
    # `needs:` block below, so the frozen 6-check branch-protection interface
    # (protocols/ci-gates.contract.md, checks[6]) is left UNTOUCHED. It mirrors
    # the eval-t1 additive pattern above: advisory-by-position, never a required
    # check.
    name: browser-fixture-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run offline fixture-parser + browser-skill tests (live cases self-skip)
        run: bunx vitest run tests/browser tests/skills tests/eval skills/browser-skills

  gate-status:
    name: gate-status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - typecheck
      - lint
      - changed-file-tests
      - hook-drift
      - docs-drift
      - library-catalog
    steps:
      - name: Compose .loom-ci/gate-status.toon
        run: |
          mkdir -p .loom-ci
          cat > .loom-ci/gate-status.toon.tmp <<EOF
          gateStatus:
            tier: pr
            workflow: pr-gate.yml
            blocking: true
            runId: ${{ github.run_id }}
            sha: ${{ github.sha }}
            completedAt: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          checks[6]{name,result,blocking,warnUntilPhase}:
            typecheck,${{ needs.typecheck.result }},true,
            lint,${{ needs.lint.result }},true,
            changed-file-tests,${{ needs.changed-file-tests.result }},true,
            hook-drift,${{ needs.hook-drift.result }},true,
            docs-drift,${{ needs.docs-drift.result }},true,
            library-catalog,${{ needs.library-catalog.result }},true,
          EOF
          mv .loom-ci/gate-status.toon.tmp .loom-ci/gate-status.toon
          cat .loom-ci/gate-status.toon

      - name: Publish gate-status artifact
        uses: actions/upload-artifact@v4
        with:
          name: gate-status
          path: .loom-ci/gate-status.toon
