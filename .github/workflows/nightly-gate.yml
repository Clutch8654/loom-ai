# nightly-gate — the nightly CI tier (F-01, contract C-01). NEVER PR-blocking.
#
# Check names below are FROZEN in protocols/ci-gates.contract.md. This tier is
# the backstop for what the changed-file PR tier misses: the full vitest suite,
# the hermetic eval tiers, the quarantine suite, and the Docker e2e harness.
#
#   full-suite        bunx vitest run (the full 1810-test suite)
#   hook-drift        warn-only until Phase 13 (defect 10)
#   docs-drift        warn-only until Phase 16
#   eval-t1 / eval-t2 stub-guarded until Phase 20 lands scripts/eval/run-evals.ts
#                     (hermetic tiers — llmCalls MUST be 0)
#   quarantine-suite  continue-on-error per contract; entries must hit zero
#                     before fileParallelism:false is removed (Phase 19)
#   docker-e2e        continue-on-error per contract (plan acceptance: nightly
#                     runs the Docker e2e job)
#
# Every run publishes `.loom-ci/gate-status.toon` as a machine-readable artifact.

name: nightly-gate

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    name: full-suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Configure git identity
        # Tests that init a throwaway repo and `git commit` need an identity;
        # CI runners have none by default. See pr-gate.yml changed-file-tests.
        run: |
          git config --global user.email "ci@loom.test"
          git config --global user.name "Loom CI"
          git config --global init.defaultBranch main

      - name: Run the full vitest suite
        run: bunx vitest run

  hook-drift:
    name: hook-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --warn-only until Phase 13 reconciles the sources (warnUntilPhase: 13).
      - name: Compare the three hook-registration sources
        run: bun scripts/ci/check-hook-drift.ts --warn-only

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-hook-drift-report
          path: .loom-ci/hook-drift.toon
          if-no-files-found: ignore

  docs-drift:
    name: docs-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --warn-only until Phase 16 (warnUntilPhase: 16).
      - name: Recompute generated-docs checksums
        run: bun scripts/ci/check-docs-drift.ts --check --warn-only

  eval-t1:
    name: eval-t1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Phase 20 lands scripts/eval/run-evals.ts; until then this is a stub
      # invocation that passes vacuously (guarded absence per plan).
      - name: Run T1 evals (hermetic, zero LLM calls)
        run: |
          if [ -f scripts/eval/run-evals.ts ]; then
            bun scripts/eval/run-evals.ts --tier t1
          else
            echo "::notice::eval-t1: scripts/eval/run-evals.ts not yet present (lands Phase 20) — stub pass"
          fi

  eval-t2:
    name: eval-t2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Phase 20 (F-20): T2 hermetic tier — replays evals/fixtures/ I/O with
      # ZERO live LLM calls (llmCalls MUST be 0), then compares the passed-eval
      # count against the main-branch floor. The floor comparison is ADVISORY
      # (nightly is never PR-blocking): a regression emits `::warning::`, never a
      # non-zero exit. The `[ -f ... ]` guard's fall-through stays harmless.
      - name: Run T2 evals (hermetic, zero LLM calls) with a regression floor vs main
        run: |
          set -u
          if [ ! -f scripts/eval/run-evals.ts ]; then
            echo "::notice::eval-t2: scripts/eval/run-evals.ts not present (pre-Phase-20) — stub pass"
            exit 0
          fi

          mkdir -p .loom-ci/eval-current .loom-ci/eval-floor

          # 1) Current commit — hermetic T2 must pass (a red eval fails the job).
          bun scripts/eval/run-evals.ts --tier t2 --out "$PWD/.loom-ci/eval-current"
          cur=$(grep -hc ',passed,' .loom-ci/eval-current/*-t2-*.toon 2>/dev/null || echo 0)
          echo "eval-t2: current passed-eval count = ${cur}"

          # 2) Establish the main-branch floor in a detached worktree (advisory).
          git fetch --depth=1 origin main || true
          floor="n/a"
          if git worktree add --detach .loom-ci/main-tree origin/main 2>/dev/null; then
            if [ -f .loom-ci/main-tree/scripts/eval/run-evals.ts ]; then
              (
                cd .loom-ci/main-tree \
                  && bun install --frozen-lockfile 2>/dev/null || bun install || true
                bun scripts/eval/run-evals.ts --tier t2 \
                  --out "$GITHUB_WORKSPACE/.loom-ci/eval-floor" || true
              )
              floor=$(grep -hc ',passed,' .loom-ci/eval-floor/*-t2-*.toon 2>/dev/null || echo 0)
            fi
            git worktree remove --force .loom-ci/main-tree || true
          fi
          echo "eval-t2: main-branch floor passed-eval count = ${floor}"

          # 3) Advisory regression check — warn only, never block the nightly gate.
          if [ "${floor}" != "n/a" ] && [ "${cur}" -lt "${floor}" ]; then
            echo "::warning::eval-t2: T2 passed-eval count ${cur} regressed below main floor ${floor} (advisory; nightly never blocks)"
          fi

      - name: Upload T2 eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-t2-results
          path: .loom-ci/eval-current/*.toon
          if-no-files-found: ignore

  quarantine-suite:
    name: quarantine-suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true # per contract: quarantine runs with continue-on-error
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run quarantined tests
        env:
          LOOM_QUARANTINE_INCLUDE: "true"
        run: |
          if [ -d tests/quarantine ]; then
            bunx vitest run tests/quarantine
          else
            echo "::notice::quarantine-suite: tests/quarantine does not exist yet (Phase 19) — nothing quarantined"
          fi

  docker-e2e:
    name: docker-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true # per contract: Docker e2e never blocks the nightly gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build local test tarball
        run: bunx tsx scripts/build-release-tarball.ts --dry-run

      # The harness self-skips (exit 0, HARNESS_SKIPPED_NO_DOCKER) when docker
      # is unavailable.
      - name: Run Docker e2e harness
        run: sh test/docker/run-harness.sh --local-tarball dist/loom-local-test.tar.gz

  daemon-e2e:
    # Live browser daemon E2E (Phase 9a, PLAN-browser-e2e). Boots the REAL
    # loom-browser daemon (headless Chromium + CDP) and drives a local fixture.
    # Follows the docker-e2e pattern: continue-on-error so a live-drive stall
    # (KNOWN-RUNTIME-GAP: the headless-Chrome <-> pw-core handshake can stall)
    # NEVER blocks the nightly gate. The suite is opt-in (LOOM_BROWSER_E2E=1)
    # and every live case self-skips with an actionable reason (C-07) when
    # Chromium is absent or the CDP handshake fails.
    name: daemon-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true # per contract: live browser e2e never blocks the nightly gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Chromium for the live drive
        # playwright-core ships the browser installer; degrade cleanly if it is
        # unavailable — the suite then self-skips on "no Chromium".
        run: bunx playwright-core install --with-deps chromium || bunx playwright-core install chromium || true

      - name: Run the live daemon-e2e suite (opt-in; self-skips without Chromium/CDP)
        env:
          LOOM_BROWSER_E2E: "1"
        run: bunx vitest run tests/browser/daemon-e2e.test.ts

  qa-outcome:
    # Ground-truth outcome eval (Phase 9a, PLAN-browser-e2e). Runs the SCORED
    # qa-outcome path in-process by INJECTING a reporter into runQaOutcome —
    # `bun scripts/eval/run-evals.ts --tier qa-outcome` advisory-skips because
    # the CLI wires no reporter, so this job stands up its own scored runner.
    # runQaOutcome still gates on LOOM_EVAL_LLM: with no live LLM key in CI it
    # degrades to the DOCUMENTED skip (exit 0), never a silent stub pass.
    # continue-on-error so the advisory eval never blocks the nightly gate.
    name: qa-outcome
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true # per contract: outcome eval is advisory, never blocks nightly
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Stand up the in-process scored qa-outcome runner
        # Writes a runner that injects a REAL reporter (driveFixture over a live
        # daemon + an LLM interpretation seam) so the scored path is exercised —
        # not the CLI's no-reporter advisory skip. Ephemeral CI-only file.
        run: |
          mkdir -p .loom-ci
          cat > .loom-ci/qa-outcome-scored.ts <<'TS'
          // Nightly qa-outcome scored runner (Phase 9a, PLAN-browser-e2e).
          // Injects a REAL reporter into runQaOutcome so the SCORED path runs,
          // unlike `run-evals.ts --tier qa-outcome` which advisory-skips (the CLI
          // wires no reporter). runQaOutcome gates on LOOM_EVAL_LLM: unset =>
          // the documented skip (exit 0), so this degrades cleanly in CI without
          // an LLM key rather than silently passing.
          import {
            runQaOutcome,
            driveFixture,
            type DetectedIssue,
            type QaReport,
            type QaReporter,
          } from "../scripts/eval/tiers/qa-outcome.ts";

          const cdp = process.env.LOOM_BROWSER_CDP;

          // The reporter is only reached when LOOM_EVAL_LLM is set (runQaOutcome
          // gate). It drives each fixture over the live loom-browser daemon
          // (driveFixture — the real P8a-deferred path) and hands the raw
          // observations to an LLM interpretation layer. That interpretation
          // layer is NOT wired in CI, so a scored run must be explicitly
          // provisioned (LOOM_BROWSER_CDP + an LLM key); absent that we fail
          // LOUDLY (caught by continue-on-error) rather than fabricate a pass.
          const reporter: QaReporter = async ({ fixture }): Promise<QaReport> => {
            if (!cdp) {
              throw new Error(
                "qa-outcome: LOOM_EVAL_LLM is set but LOOM_BROWSER_CDP is not — " +
                  "point it at a live loom-browser daemon to drive fixtures.",
              );
            }
            await driveFixture(cdp, fixture, []);
            throw new Error(
              "qa-outcome: fixture driven, but the LLM interpretation layer is " +
                "not provisioned in this environment — wire a judge to score.",
            );
            // Unreachable; documents the report shape the judge must return.
            const issues: DetectedIssue[] = [];
            return { fixture, issues };
          };

          const out = await runQaOutcome({ reporter });
          for (const w of out.warnings) console.error(`::warning::${w}`);
          console.error(
            `qa-outcome: status=${out.status} llmCalls=${out.llmCalls} ` +
              `results=${out.results.length}`,
          );
          process.exit(out.exitCode);
          TS

      - name: Run the scored qa-outcome eval (degrades to documented skip without an LLM key)
        run: bun .loom-ci/qa-outcome-scored.ts

  gate-status:
    name: gate-status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - full-suite
      - hook-drift
      - docs-drift
      - eval-t1
      - eval-t2
      - quarantine-suite
      - docker-e2e
    steps:
      - name: Compose .loom-ci/gate-status.toon
        run: |
          mkdir -p .loom-ci
          cat > .loom-ci/gate-status.toon.tmp <<EOF
          gateStatus:
            tier: nightly
            workflow: nightly-gate.yml
            blocking: false
            schedule: 0 7 * * *
            runId: ${{ github.run_id }}
            sha: ${{ github.sha }}
            completedAt: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          checks[7]{name,result,blocking,warnUntilPhase}:
            full-suite,${{ needs.full-suite.result }},false,
            hook-drift,${{ needs.hook-drift.result }},false,13
            docs-drift,${{ needs.docs-drift.result }},false,16
            eval-t1,${{ needs.eval-t1.result }},false,
            eval-t2,${{ needs.eval-t2.result }},false,
            quarantine-suite,${{ needs.quarantine-suite.result }},false,
            docker-e2e,${{ needs.docker-e2e.result }},false,
          EOF
          mv .loom-ci/gate-status.toon.tmp .loom-ci/gate-status.toon
          cat .loom-ci/gate-status.toon

      - name: Publish gate-status artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-gate-status
          path: .loom-ci/gate-status.toon
